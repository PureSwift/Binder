name: Swift
on: [push]
jobs:

  macos:
    name: macOS
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    strategy:
      matrix:
        config: ["debug", "release"]
        options: ["", "SWIFT_BUILD_DYNAMIC_LIBRARY=1"]
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Swift Version
      run: swift --version
    - name: Build
      run: ${{ matrix.options }} swift build -c ${{ matrix.config }}
    - name: Test
      run: ${{ matrix.options }} swift test -c ${{ matrix.config }}
  
  linux:
    name: Linux
    strategy:
      matrix:
        container: ["swift:6.0.3", "swift:6.1.2", "swift:6.4.2"]
        config: ["debug", "release"]
        options: ["", "SWIFT_BUILD_DYNAMIC_LIBRARY=1"]
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}-jammy
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Swift Version
      run: swift --version
    - name: Build
      run: ${{ matrix.options }} swift build -c ${{ matrix.config }}

  android-arm:
      name: Android
      strategy:
        fail-fast: false
        matrix:
          arch: ["aarch64", "x86_64"]
      runs-on: ubuntu-latest
      container: swift:6.4.2-jammy
      timeout-minutes: 30
      steps:
        - uses: actions/checkout@v4
        - name: Install Android NDK
          run: |
            apt-get update
            apt-get install -y curl unzip
            curl --fail --location --retry 3 --output /tmp/android-ndk.zip https://dl.google.com/android/repository/android-ndk-r30-Linux.zip
            unzip -q /tmp/android-ndk.zip -d /opt
            echo "ANDROID_NDK_HOME=/opt/android-ndk-r30" >> "$GITHUB_ENV"
        - name: Install Swift SDK for Android
          run: |
            swift sdk install https://download.swift.org/swift-6.4.2-release/android-sdk/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE_android.artifactbundle.tar.gz \
              --checksum 4d6ad63ea74becd58e123ff58b1b48c3be5ec0db0dff0ea5abe37ac007dd3233
        - name: Build Swift Package for Android
          run: swift build --swift-sdk swift-6.4.2-RELEASE_android --triple ${{ matrix.arch }}-unknown-linux-android23
