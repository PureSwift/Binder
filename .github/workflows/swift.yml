name: Swift
on: [push]

jobs:

  macos:
    name: macOS
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    strategy:
      matrix:
        config: ["debug", "release"]
        options: ["", "SWIFT_BUILD_DYNAMIC_LIBRARY=1"]
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Swift Version
      run: swift --version
    - name: Build
      run: ${{ matrix.options }} swift build -c ${{ matrix.config }}
    - name: Test
      run: ${{ matrix.options }} swift test -c ${{ matrix.config }}

  linux:
    name: Linux
    strategy:
      fail-fast: false
      matrix:
        # x86_64 and native arm64. arm64 is the architecture Android and most
        # binder targets actually run on, so testing there rather than only
        # cross-compiling to it is worth a runner.
        os: ["ubuntu-latest", "ubuntu-24.04-arm"]
        config: ["debug", "release"]
        options: ["", "SWIFT_BUILD_DYNAMIC_LIBRARY=1"]
    runs-on: ${{ matrix.os }}
    container: swift:6.4.2-jammy
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Swift Version
      run: swift --version
    - name: Build
      run: ${{ matrix.options }} swift build -c ${{ matrix.config }}
    # The suite runs the whole protocol layer without a binder device: the
    # two tests that need /dev/binder skip when it is absent, which it is on
    # a CI runner. So Linux, the platform this library actually targets, now
    # tests rather than only building.
    - name: Test
      run: ${{ matrix.options }} swift test -c ${{ matrix.config }}

  android:
    name: Android
    strategy:
      fail-fast: false
      matrix:
        arch: ["aarch64", "x86_64"]
    runs-on: ubuntu-latest
    container: swift:6.4.2-jammy
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Android NDK
        run: |
          apt-get update
          apt-get install -y curl unzip
          curl --fail --location --retry 3 --output /tmp/android-ndk.zip https://dl.google.com/android/repository/android-ndk-r30-Linux.zip
          unzip -q /tmp/android-ndk.zip -d /opt
          echo "ANDROID_NDK_HOME=/opt/android-ndk-r30" >> "$GITHUB_ENV"
      - name: Install Swift SDK for Android
        run: |
          swift sdk install https://download.swift.org/swift-6.4.2-release/android-sdk/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE_android.artifactbundle.tar.gz \
            --checksum 4d6ad63ea74becd58e123ff58b1b48c3be5ec0db0dff0ea5abe37ac007dd3233
      - name: Build Swift Package for Android
        # Socket uses if_nameindex and if_freenameindex, available since API 24.
        run: swift build --swift-sdk swift-6.4.2-RELEASE_android --triple ${{ matrix.arch }}-unknown-linux-android24

  # Cross-compile against Apple's Static Linux SDK, which is musl-based. This
  # is what exercises the musl path in CBinder — the kernel uapi headers are
  # absent from the musl sysroot, so the C shim falls back to defining the
  # __uN types itself and taking the ioctl macros from <sys/ioctl.h>.
  musl:
    name: Linux (musl)
    strategy:
      fail-fast: false
      matrix:
        arch: ["aarch64", "x86_64"]
    runs-on: ubuntu-latest
    container: swift:6.4.2-jammy
    env:
      # The Static Linux SDK bundle for the toolchain above. The checksum is
      # published in swift.org's releases.json and must be updated alongside
      # the container tag — it is specific to the exact bundle.
      STATIC_SDK_URL: "https://download.swift.org/swift-6.4.2-release/static-sdk/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz"
      STATIC_SDK_CHECKSUM: "3786b179936d9cc9e266dd506bd1654176358d7b25288e243359f4d17cc4dc5a"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Swift Version
        run: swift --version
      - name: Install the Static Linux SDK
        run: swift sdk install "$STATIC_SDK_URL" --checksum "$STATIC_SDK_CHECKSUM"
      - name: Build
        # A binder client is not statically linkable in practice, but the point
        # here is to compile the source against musl, so the ordinary product
        # build is what matters.
        run: swift build --swift-sdk ${{ matrix.arch }}-swift-linux-musl
